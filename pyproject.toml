[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routerless"
version = "0.1.0"
description = "Router-agnostic network configuration manager"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "paramiko>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
routerless = "routerless.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["routerless"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.0",
]
