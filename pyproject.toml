[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routerless"
dynamic = ["version"]
description = "Router-agnostic network configuration manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "routerless contributors" }]
keywords = ["router", "network", "configuration", "dhcp", "nat", "firewall", "infrastructure-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "paramiko>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/grogui42/routerless"
Repository = "https://github.com/grogui42/routerless"
Issues = "https://github.com/grogui42/routerless/issues"

[project.scripts]
routerless = "routerless.cli:cli"

[tool.hatch.version]
path = "routerless/version.py"

[tool.hatch.build.targets.wheel]
packages = ["routerless"]
include = [
    "routerless/templates/*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pip-audit>=2.7",
    "build>=1.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["_patch_tests.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "S", "I"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106"]
