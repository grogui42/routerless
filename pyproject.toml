[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routerless"
version = "0.1.0"
description = "Router-agnostic network configuration manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "routerless contributors" }]
keywords = ["router", "network", "configuration", "dhcp", "nat", "firewall", "infrastructure-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "paramiko>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/you/routerless"
Repository = "https://github.com/you/routerless"
Issues = "https://github.com/you/routerless/issues"

[project.scripts]
routerless = "routerless.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["routerless"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.0",
    "pip-audit>=2.7",
    "build>=1.0",
]
